# Test de démarrage sur émulateur : la release (R8 comprise) de chaque édition
# est installée, une session factice est rangée (état « connecté »), puis l'app
# est lancée. Échoue si elle plante, se fige ou n'affiche pas « Découvrir ».
# Le journal du plantage est écrit dans le journal du job.
#
# Aucun vrai service n'est appelé : l'adresse de l'API pointe vers un domaine
# réservé qui n'existe pas (.invalid), et la release est signée avec la clé de
# debug (ces APK ne sont pas publiés).
name: Démarrage Android (émulateur)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - core/**
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/android-smoke.yml
      - .github/scripts/android-smoke.sh

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  HEYWATCHLIST_API_URL: https://api.invalid
  # Mêmes réglages Firebase que les vraies versions : l'initialisation de
  # Firebase et de Crashlytics fait partie de ce qu'on teste.
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  smoke:
    name: Démarrage (${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flavor: [public, admin]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android

      - name: Compiler la release et l'APK de test
        working-directory: android
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euo pipefail
          task="${FLAVOR^}Release"
          ./gradlew ":app:assemble$task" ":app:assemble${task}AndroidTest" -Pheywatchlist.smoke --stacktrace

      # Accélération matérielle de l'émulateur sur les runners Linux.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'app sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        env:
          FLAVOR: ${{ matrix.flavor }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash .github/scripts/android-smoke.sh "$FLAVOR"
