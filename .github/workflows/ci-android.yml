# Android : tests (buildSrc et édition publique), contrôle de la release publique
# (R8), APK admin de debug en artefact, puis, sur main ou un tag et si les
# secrets de signature existent, APK admin signé, APK public signé (installation
# directe) et AAB public (Play Store). Sur un tag de version `v*`, ou à la main,
# l'AAB part sur Google Play (test fermé) si la clé du compte de service existe.
# Linux seulement (aucune minute macOS).
name: CI Android

on:
  pull_request:
    paths:
      - android/**
      - core/**
      - tools/**
      # Seuls les scripts que ce workflow lance (pas celui d'iOS).
      - scripts/build-android-core.sh
      - scripts/generate-bindings.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci-android.yml
      # Seules les actions que ce workflow utilise.
      - .github/actions/setup-android/**
      - .github/actions/setup-rust/**
      - .github/scripts/check-secrets.sh
      - .github/scripts/play-upload*.mjs
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - android/**
      - core/**
      - tools/**
      - scripts/build-android-core.sh
      - scripts/generate-bindings.sh
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci-android.yml
      # Seules les actions que ce workflow utilise.
      - .github/actions/setup-android/**
      - .github/actions/setup-rust/**
      - .github/scripts/check-secrets.sh
      - .github/scripts/play-upload*.mjs
  workflow_dispatch:
    inputs:
      release:
        description: Produire aussi les APK signés et l'AAB public (secrets de signature requis)
        type: boolean
        default: false
      play:
        description: Envoyer aussi l'AAB sur Google Play, test fermé (implique les versions signées ; version jamais envoyée)
        type: boolean
        default: false
      captures_ref:
        description: Rendre les captures d'un autre commit (SHA), pour comparer avant et après
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Adresse de l'API (Worker Cloudflare), écrite dans l'app au moment de la
  # compilation. Variable GitHub, pas un secret ; absente, l'app l'indique.
  HEYWATCHLIST_API_URL: ${{ vars.HEYWATCHLIST_API_URL }}
  # Réglages Firebase des notifications (google-services.json en base64), lus
  # par app/build.gradle.kts. Absent : l'app se compile, sans notifications.
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

jobs:
  build:
    name: Tests et APK admin de debug
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-android

      # Le code de buildSrc (lecture de la version dans Cargo.toml) a ses propres
      # tests ; Gradle ne les lance pas avec ceux de l'app.
      - name: Tests de buildSrc
        working-directory: android
        run: ./gradlew -p buildSrc test --stacktrace

      - name: Tests du script d'envoi Google Play
        run: node --test .github/scripts/play-upload.test.mjs

      - name: Tests des deux éditions et APK admin de debug
        working-directory: android
        run: ./gradlew testPublicDebugUnitTest testAdminDebugUnitTest assembleAdminDebug --stacktrace

      # R8 (minification) et la lint de release ne tournent que sur les builds de
      # release : sans cette étape, une règle R8 manquante ne se verrait qu'après
      # la fusion. Sans keystore (pull request), la release est signée avec la clé
      # de debug : cet APK n'est pas publié.
      - name: Vérifier la release de l'édition publique (R8)
        working-directory: android
        run: ./gradlew assemblePublicRelease --stacktrace

      - name: Publier l'APK admin de debug
        uses: actions/upload-artifact@v7
        with:
          name: heywatchlist-admin-debug-apk
          path: android/app/build/outputs/apk/admin/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publier les rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-rapports-de-tests
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
            android/buildSrc/build/reports/tests
            android/buildSrc/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Captures des écrans (données et images inventées), rendues sur la JVM par
  # Robolectric : de quoi juger l'interface sans installer l'app. Artefact
  # `captures-android`, des PNG.
  captures:
    name: Captures d'écran
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Robolectric télécharge lui-même ses images d'Android : par le miroir Google
      # de Maven Central, qui refuse souvent (429) les machines partagées de la CI.
      # Variable lue par toute JVM, donc aussi pour un ancien commit (captures_ref),
      # avec l'écriture des captures que 5d37bdb n'activait pas encore.
      JAVA_TOOL_OPTIONS: -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2/ -Droborazzi.test.record=true
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.captures_ref }}

      - uses: ./.github/actions/setup-android

      - name: Rendre les captures
        working-directory: android
        run: ./gradlew testPublicDebugUnitTest testAdminDebugUnitTest -Pscreenshots --stacktrace

      - name: Captures dans le journal (lancement à la main)
        # Les artefacts passent par un stockage que certains outils ne joignent
        # pas : à la main, chaque capture est aussi écrite dans le journal, en JPEG
        # réduit et en base64, entre deux repères.
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          shopt -s nullglob
          # ImageMagick n'est plus dans l'image ubuntu-24.04 du runner.
          command -v convert >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends imagemagick >/dev/null
          }
          for f in android/app/build/captures/*.png; do
            name="$(basename "$f" .png)"
            convert "$f" -resize 50% -quality 82 "$RUNNER_TEMP/$name.jpg"
            echo "=== capture $name ==="
            # Une ligne par capture : le journal reste court en nombre de lignes.
            base64 -w 0 "$RUNNER_TEMP/$name.jpg"
            echo
            echo "=== fin ==="
          done

      - name: Publier les captures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: captures-android
          path: android/app/build/captures/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Publier les rapports de tests (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: captures-rapports
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: APK signés et AAB public
    needs: build
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.release || inputs.play))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Vérifier les secrets de signature
        id: secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash .github/scripts/check-secrets.sh ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD

      - name: Préparer la compilation Android
        if: steps.secrets.outputs.ready == 'true'
        uses: ./.github/actions/setup-android

      - name: Compiler les versions signées
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/heywatchlist-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode >"$ANDROID_KEYSTORE_PATH"
          ./gradlew assembleAdminRelease assemblePublicRelease bundlePublicRelease --stacktrace

      - name: Supprimer le keystore du runner
        if: always() && steps.secrets.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/heywatchlist-release.jks"

      # Empreintes du certificat de signature, à déclarer dans la console Google
      # (client OAuth Android, un par nom de paquet) pour « Se connecter avec
      # Google ». Information publique : elle figure dans chaque APK.
      - name: Afficher les empreintes de signature
        if: steps.secrets.outputs.ready == 'true'
        working-directory: android/app/build/outputs/apk
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          {
            echo "### Empreintes de signature (console Google, client OAuth Android)"
            for flavor in admin public; do
              apk="$(find "$flavor/release" -name '*.apk' | head -n 1)"
              echo
              echo "**$flavor** \`$apk\`"
              echo '```'
              "$apksigner" verify --print-certs "$apk" | grep -E 'SHA-(1|256) digest'
              echo '```'
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publier l'APK admin signé
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: heywatchlist-admin-release-apk
          path: android/app/build/outputs/apk/admin/release/*.apk
          if-no-files-found: error
          retention-days: 30

      # APK de l'édition publique, signé avec la même clé que l'AAB : il
      # s'installe directement sur un téléphone, sans passer par le Play Store.
      - name: Publier l'APK public signé
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: heywatchlist-public-release-apk
          path: android/app/build/outputs/apk/public/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publier l'AAB public
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: heywatchlist-public-release-aab
          path: android/app/build/outputs/bundle/publicRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      # Google Play : seulement sur un tag de version ou avec la case « Envoyer
      # sur Google Play ». Chaque envoi exige un numéro de version nouveau
      # (versionCode tiré de Cargo.toml) : un tag par version.
      - name: Vérifier la clé Google Play
        id: play
        if: steps.secrets.outputs.ready == 'true' && (startsWith(github.ref, 'refs/tags/v') || inputs.play)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: bash .github/scripts/check-secrets.sh PLAY_SERVICE_ACCOUNT_JSON

      - name: Envoyer l'AAB sur Google Play
        if: steps.play.outputs.ready == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          # Édition publique seulement : l'APK admin ne va jamais sur Google Play.
          PLAY_PACKAGE_NAME: io.github.shweepsi.heywatchlist
          # « alpha » est la piste « Test fermé » de la Play Console.
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
          PLAY_CHANGELOG: CHANGELOG.md
        run: |
          set -euo pipefail
          aab="$(find android/app/build/outputs/bundle/publicRelease -name '*.aab' | head -n 1)"
          node .github/scripts/play-upload.mjs "$aab"
