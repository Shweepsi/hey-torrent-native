# Backend Cloudflare (Worker `heywatchlist-api` et base D1) : types et tests
# sur chaque PR, puis, sur `main`, migrations de la base et déploiement.
# Aucun test n'appelle Cloudflare, Apple ni Google : tout est simulé en local.
name: CI backend

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/ci-backend.yml
      - .github/scripts/check-secrets.sh
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/ci-backend.yml
      - .github/scripts/check-secrets.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Jamais deux déploiements à la fois ; une PR, elle, peut être relancée.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: backend

jobs:
  test:
    name: Types et tests du Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci
        run: npm ci
      - name: TypeScript
        run: npm run check
      - name: Vitest (workerd local)
        run: npm test

  deploy:
    name: Migrations D1 et déploiement
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vérifier les secrets Cloudflare
        id: secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: bash .github/scripts/check-secrets.sh CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: npm ci
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci
      - name: Migrations de la base D1
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply DB --remote
      - name: Déployer le Worker
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
