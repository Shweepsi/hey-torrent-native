# Catalogue de versions. Les numéros sont des versions publiées ; un ajout ou
# une montée de version se fait ici, jamais dans app/build.gradle.kts.

[versions]
agp = "8.13.0"
kotlin = "2.2.21"
# Une seule version pour toute la pile Compose (foundation, ui, runtime...).
# compose, activity et lifecycle sont alignés sur ce que demande Haze 1.7.1
# (via ses dépendances JetBrains, qui renvoient vers androidx) : à monter avec
# lui, sinon Gradle résout des versions mélangées.
compose = "1.9.4"
activity = "1.11.0"
lifecycle = "2.9.4"
coroutines = "1.10.2"
haze = "1.7.1"
jna = "5.18.1"
# Connexion Google par le Credential Manager du système.
credentials = "1.6.0"
# googleid 1.2.x est compilé avec Kotlin 2.4, illisible par notre Kotlin 2.2 :
# rester en 1.1.x tant que le plugin Kotlin n'est pas monté.
googleid = "1.1.1"
# Affiches et photos du catalogue. Coil 3.4+ est compilé avec Kotlin 2.3 (comme
# googleid 1.2.x), illisible par notre Kotlin 2.2 : ne PAS prendre plus récent
# tant que le plugin Kotlin n'est pas monté.
coil = "3.3.0"
# Push « Disponible sur Plex » (FCM), sans le plugin Google Services ni la
# BoM : l'app initialise Firebase elle-même (app/build.gradle.kts).
firebase-messaging = "26.0.2"
# Même nomenclature Firebase (BoM 35.2.0) que firebase-messaging.
firebase-crashlytics = "21.1.0"
firebase-crashlytics-plugin = "3.0.8"
google-services = "4.6.0"
junit = "4.13.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
# Le chargeur réseau, enregistré tout seul au démarrage : sans lui, Coil ne sait pas lire une URL.
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
googleid = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }
firebase-messaging = { module = "com.google.firebase:firebase-messaging", version.ref = "firebase-messaging" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics", version.ref = "firebase-crashlytics" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
# Dépendance requise par le code UniFFI Kotlin. Elle est utilisée sous sa forme
# `aar` (qui embarque libjnidispatch.so) : voir app/build.gradle.kts.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-plugin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
