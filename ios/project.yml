# Projet Xcode de HeyWatchlist, décrit pour XcodeGen (https://github.com/yonaskolb/XcodeGen).
# Le .xcodeproj n'est jamais versionné : il se génère avec `xcodegen generate`
# depuis ce dossier, APRÈS scripts/build-ios-xcframework.sh (qui produit
# Generated/, Frameworks/ et Config/Version.xcconfig). Voir ios/README.md.
name: HeyWatchlist

options:
  bundleIdPrefix: io.github.shweepsi.heywatchlist
  developmentLanguage: fr
  createIntermediateGroups: true
  deploymentTarget:
    # iOS 26 minimum : Liquid Glass natif partout, sans repli. Garder la même
    # valeur que IOS_DEPLOYMENT_TARGET dans scripts/build-ios-xcframework.sh.
    iOS: "26.0"

# MARKETING_VERSION et CURRENT_PROJECT_VERSION viennent de Config/Version.xcconfig
# (inclus par Base.xcconfig). Ne pas les définir dans `settings` : un réglage du
# projet l'emporterait sur le fichier .xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    # Si les liaisons UniFFI générées refusent de compiler en Swift 6, repasser
    # ici à "5" (un seul réglage) le temps de corriger.
    SWIFT_VERSION: "6.0"

settingGroups:
  # Appliqué à chaque cible, pas au projet : les réglages par défaut de
  # XcodeGen pour iOS (iPhone et iPad, `TARGETED_DEVICE_FAMILY: 1,2`) sont posés
  # au niveau des cibles et l'emporteraient sur ceux du projet.
  iphone-arm64:
    TARGETED_DEVICE_FAMILY: "1" # iPhone seulement
    # Le cœur n'est compilé que pour arm64 (appareil et simulateur).
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64

targets:
  HeyWatchlist:
    type: application
    platform: iOS
    sources:
      - path: HeyWatchlist
      # Liaisons Swift générées par UniFFI. Le dossier doit exister : XcodeGen
      # échoue sinon, ce qui évite un projet sans liaisons. Seuls les .swift
      # sont compilés (l'en-tête C et le modulemap vivent dans le XCFramework).
      - path: Generated
        includes:
          - "*.swift"
    dependencies:
      # Bibliothèque statique : liée, jamais embarquée dans le .app.
      - framework: Frameworks/HeyWatchlistCore.xcframework
        embed: false
        link: true
    info:
      path: Config/Info.plist
      properties:
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr]
        CFBundleDisplayName: HeyWatchlist
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Aucun chiffrement propre à l'app (HTTPS du système seulement).
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIRequiredDeviceCapabilities: [arm64]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Fond sombre dès le lancement, sans éclair blanc (couleur du catalogue).
        UILaunchScreen:
          UIColorName: Background
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Adresse de l'API, écrite par scripts/build-ios-xcframework.sh
        # (variable HEYWATCHLIST_API_URL de la CI), jamais dans le dépôt.
        HeyWatchlistAPIURL: $(HEYWATCHLIST_API_URL)
        # Aucune permission demandée : pas de clé NS...UsageDescription.
    # « Se connecter avec Apple ». fastlane coche la capacité chez Apple et
    # régénère le profil si besoin (ios/fastlane/Fastfile, ensure_capabilities).
    entitlements:
      path: Config/HeyWatchlist.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    settings:
      groups: [iphone-arm64]
      base:
        # Identifiant décidé par le propriétaire (docs/DECISIONS.md), définitif après
        # publication. fastlane le lit ici (Appfile) : ne l'écrire nulle part ailleurs.
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shweepsi.heywatchlist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # Signature : DEVELOPMENT_TEAM et le profil sont fournis par la CI
        # (fastlane), jamais écrits dans le dépôt.

  HeyWatchlistTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HeyWatchlistTests
    dependencies:
      # Les tests sont hébergés par l'app : la bibliothèque Rust y est déjà liée.
      # XcodeGen en déduit TEST_HOST (pas BUNDLE_LOADER, posé ci-dessous).
      - target: HeyWatchlist
      # Le Swift généré expose des types du module C du cœur (RustBuffer…) :
      # `@testable import HeyWatchlist` doit donc le voir aussi. Xcode ne publie
      # les en-têtes d'un XCFramework qu'aux cibles qui le lient. Aucun symbole
      # Rust n'est repris ici : ceux de l'app viennent du BUNDLE_LOADER.
      - framework: Frameworks/HeyWatchlistCore.xcframework
        embed: false
        link: true
    settings:
      groups: [iphone-arm64]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.shweepsi.heywatchlist.tests
        GENERATE_INFOPLIST_FILE: YES
        # Lie les tests aux symboles de l'app (`@testable import HeyWatchlist`).
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  HeyWatchlist:
    build:
      targets:
        HeyWatchlist: all
        HeyWatchlistTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HeyWatchlistTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
