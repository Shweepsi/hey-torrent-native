# Worker du backend de HeyWatchlist. Le nom est imposé : le Worker
# `heywatchlist-api` existe déjà et porte le secret FCM_SERVICE_ACCOUNT ; un
# autre nom créerait un Worker sans ses secrets.
# Secrets (jamais ici) : voir backend/README.md.
name = "heywatchlist-api"
main = "src/index.ts"
compatibility_date = "2026-11-01"
workers_dev = true

[observability]
enabled = true

# Pas de journal d'appel par requête : il garderait l'URL complète, donc le
# jeton secret des webhooks Plex et Tautulli (`/v1/hooks/<source>/<jeton>`).
# Les `console.*` du Worker, qui ne journalisent jamais de secret, restent.
[observability.logs]
invocation_logs = false

[vars]
# Identifiant de l'app iPhone : public, c'est l'audience des jetons Apple.
APPLE_CLIENT_ID = "io.github.shweepsi.heywatchlist"

# Recherche automatique, alertes et lecture de Plex (src/autosearch.ts).
[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "heywatchlist"
database_id = "41769bb4-adeb-41d5-8aeb-7fea6c49ad1f"
migrations_dir = "migrations"
