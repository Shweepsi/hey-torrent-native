[package]
name = "heywatchlist-core"
description = "Cœur Rust partagé de HeyWatchlist, exposé à Swift et Kotlin par UniFFI"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "heywatchlist_core"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
default = []
# Code d'administration : activé seulement pour l'édition admin Android.
admin = []

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
# HTTPS par rustls ; pas de TLS du système (voir `api::http_client`).
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
# Cache hors ligne du catalogue. SQLite est compilé avec la bibliothèque
# (`bundled`) : aucune dépendance au SQLite du système, identique sur iOS et Android.
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.2"
thiserror = "2"
# Le runtime est fourni par UniFFI (feature `tokio`, via async-compat) : on
# n'a besoin ici que de `Handle`, du verrou et de l'initialisation paresseuse
# asynchrones.
tokio = { version = "1", default-features = false, features = ["rt", "sync"] }
uniffi = { version = "0.32.2", features = ["tokio"] }
url = "2.5.8"

# Android : racines de confiance embarquées (voir `api::http_client`).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1.0.11"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["macros", "rt"] }
webpki-root-certs = "1.0.11"
wiremock = "0.6.5"

[lints]
workspace = true
